[project]
name = "fastapi-foundational-layer"
version = "0.1.0"
description = "FastAPI learning and practice project"
requires-python = "==3.14.*"
dependencies = [
    "fastapi[all]",
    "scalar-fastapi",
    "sqlmodel",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "passlib[bcrypt]",
    "bcrypt==4.0.1",
    "pyjwt==2.15.1",
    "redis[hiredis]",
    "alembic",
    "fastapi-mail",
    "twilio",
    "celery==5.6.3",
    "flower==2.2.0"
]

[dependency-groups]
dev = [
    "pytest",
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.ruff]
line-length = 88