[project]
name = "fastapi-foundational-layer"
version = "0.1.0"
description = "FastAPI learning and practice project"
requires-python = "==3.14.*"
dependencies = [
    "fastapi[all]",
    "scalar-fastapi",
    "sqlmodel",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "passlib[bcrypt]",
    "bcrypt==4.0.1",
    "pyjwt==2.15.1",
    "redis[hiredis]",
    "alembic",
    "fastapi-mail",
    "twilio",
    "celery==5.6.3",
    "flower==2.2.0",
    "segno==1.6.6"
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "fakeredis",
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.ruff]
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
# Async tests and fixtures work without a @pytest.mark.asyncio on each one
asyncio_mode = "auto"
# One event loop for the whole run, the database engine is shared by every test
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

